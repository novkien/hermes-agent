name: Bootstrap runtime invariant fix

on:
  push:
    branches: [fix/runtime-invariant-regressions]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Apply exact runtime fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          system_prompt = Path("agent/system_prompt.py")
          text = system_prompt.read_text(encoding="utf-8")

          old_import = "from agent.runtime_invariants import ARTIFACT_FILESYSTEM_CONTRACT\n"
          if text.count(old_import) != 1:
              raise SystemExit("unexpected runtime_invariants import count")
          text = text.replace(old_import, "", 1)

          old_duplicate = '''    # Universal artifact/filesystem discipline is a runtime invariant. It is
              # independent of SOUL.md and context-file loading, so every construction
              # path — including delegated children with skip_context_files=True — gets it.
              stable_parts.append(ARTIFACT_FILESYSTEM_CONTRACT)

          '''
          if text.count(old_duplicate) != 1:
              raise SystemExit("unexpected duplicate artifact-contract block count")
          text = text.replace(old_duplicate, "", 1)

          if text.count("stable_parts.append(ARTIFACT_FILESYSTEM_CONTRACT)") != 1:
              raise SystemExit("artifact contract must be appended exactly once")
          system_prompt.write_text(text, encoding="utf-8")

          runtime_invariants = Path("agent/runtime_invariants.py")
          runtime_invariants.write_text(
              '''"""Compatibility exports for always-on Hermes runtime invariants."""\n\n'''
              '''from __future__ import annotations\n\n'''
              '''from agent.artifact_filesystem_contract import ARTIFACT_FILESYSTEM_CONTRACT\n\n'''
              '''if len(ARTIFACT_FILESYSTEM_CONTRACT.splitlines()) > 50:\n'''
              '''    raise RuntimeError("Artifact Filesystem Contract must not exceed 50 lines")\n\n'''
              '''__all__ = ["ARTIFACT_FILESYSTEM_CONTRACT"]\n''',
              encoding="utf-8",
          )

          model_tools = Path("model_tools.py")
          text = model_tools.read_text(encoding="utf-8")
          old_scope = '''    schema_toolsets = None
              if enabled_toolsets is not None:
                  kanban_names = set(resolve_toolset("kanban"))
                  schema_toolsets = {"kanban"} if tools_to_include & kanban_names else set()
          '''
          new_scope = '''    schema_toolsets = None
              if enabled_toolsets is not None:
                  schema_toolsets = {"kanban"} if "kanban" in effective_enabled_toolsets else set()
          '''
          if text.count(old_scope) != 1:
              raise SystemExit("unexpected Kanban schema-scope block count")
          text = text.replace(old_scope, new_scope, 1)
          model_tools.write_text(text, encoding="utf-8")
          PY

      - name: Validate patched invariants
        run: |
          python -m compileall -q agent/system_prompt.py agent/runtime_invariants.py model_tools.py
          python - <<'PY'
          from pathlib import Path
          source = Path("agent/system_prompt.py").read_text(encoding="utf-8")
          assert source.count("stable_parts.append(ARTIFACT_FILESYSTEM_CONTRACT)") == 1
          model_tools = Path("model_tools.py").read_text(encoding="utf-8")
          assert 'schema_toolsets = {"kanban"} if "kanban" in effective_enabled_toolsets else set()' in model_tools
          PY
          git diff --check

      - name: Commit source fix and remove bootstrap workflow
        run: |
          rm .github/workflows/bootstrap-runtime-invariant-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- agent/system_prompt.py agent/runtime_invariants.py model_tools.py .github/workflows/bootstrap-runtime-invariant-fix.yml
          git diff --cached --check
          git commit -m "fix: restore runtime invariant isolation"
          git push origin HEAD:fix/runtime-invariant-regressions
