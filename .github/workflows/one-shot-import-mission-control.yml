name: One-shot full Mission Control import

on:
  push:
    branches:
      - agent/integrate-full-mission-control
    paths:
      - .github/workflows/one-shot-import-mission-control.yml

permissions:
  contents: write

concurrency:
  group: one-shot-import-mission-control
  cancel-in-progress: false

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: agent/integrate-full-mission-control
      ARTIFACT_URL: 'https://sdmntprseasia.oaiusercontent.com/files/00000000-b66c-8207-b0e1-723136e66f90/raw?se=2026-08-14T11%3A33%3A12Z&sp=r&sv=2026-02-06&sr=b&scid=20595c32-a8f2-52d3-8589-1cde8db8fafc&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-14T01%3A55%3A39Z&ske=2026-08-15T01%3A55%3A39Z&sks=b&skv=2026-02-06&sig=J/BrjwfmXNKbtxph9Oa1f%2BltgvUejgIF6eJfUv1AVZc%3D'
      OUTER_ARTIFACT_SHA256: 9d95364cc398d5b67dd2a771825272133cd4e27d5b6b19923e4d0edca2add282
      INNER_TRANSFER_SHA256: e823b7af64f93e151292bb02e7d087b140efa23d9e3f9282cd06f576cd64bd54
      EXPECTED_SOURCE_COMMIT: 42a9c191fdebc66ace4aac98a1e581d9ab7a13d1
      EXPECTED_SOURCE_TREE: 4fa5660d088401f2f62a4d76c37af60fadd747fc
      EXPECTED_SOURCE_COUNT: "147"
      EXPECTED_MANIFEST_SHA256: 3958406fa8d53029354be641a9f7e3938d5acf87e79048b4e0909f05129df5af
      EXPECTED_ARCHIVE_B64_SHA256: afd2fb5343888789f53ecdb7dcf9edbf2756628c8df5e79cb7e9bbfb290bc66b

    steps:
      - name: Check out integration branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          ref: agent/integrate-full-mission-control
          persist-credentials: true

      - name: Download and verify locked private-source transfer
        shell: bash
        run: |
          set -euo pipefail
          outer_zip="$RUNNER_TEMP/mc-artifact.zip"
          outer_dir="$RUNNER_TEMP/mc-artifact"
          export_dir="$RUNNER_TEMP/mc-export"
          rm -rf "$outer_dir" "$export_dir" "$outer_zip"
          mkdir -p "$outer_dir" "$export_dir"

          curl --fail --location --retry 3 --silent --show-error \
            "$ARTIFACT_URL" -o "$outer_zip"
          echo "$OUTER_ARTIFACT_SHA256  $outer_zip" | sha256sum -c -
          python -m zipfile -e "$outer_zip" "$outer_dir"

          inner_zip="$outer_dir/mission-control-hermes-import.zip"
          test -f "$inner_zip"
          echo "$INNER_TRANSFER_SHA256  $inner_zip" | sha256sum -c -
          python -m zipfile -e "$inner_zip" "$export_dir"

          actual_manifest_sha="$(sha256sum "$export_dir/SOURCE_MANIFEST.tsv" | awk '{print $1}')"
          actual_source_count="$(wc -l < "$export_dir/SOURCE_MANIFEST.tsv" | tr -d ' ')"
          actual_archive_b64_sha="$(cat "$export_dir"/archive.b64.part.* | sha256sum | awk '{print $1}')"
          printf 'manifest_sha=%s\nsource_count=%s\narchive_b64_sha=%s\n' \
            "$actual_manifest_sha" "$actual_source_count" "$actual_archive_b64_sha"
          test "$actual_manifest_sha" = "$EXPECTED_MANIFEST_SHA256"
          test "$actual_source_count" = "$EXPECTED_SOURCE_COUNT"
          test "$actual_archive_b64_sha" = "$EXPECTED_ARCHIVE_B64_SHA256"

          python - "$export_dir/EXPORT_METADATA.json" <<'PY'
          import json
          import os
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = {
              "source_repository": "novkien/agent-mission-control",
              "source_commit": os.environ["EXPECTED_SOURCE_COMMIT"],
              "source_tree": os.environ["EXPECTED_SOURCE_TREE"],
              "tracked_file_count": int(os.environ["EXPECTED_SOURCE_COUNT"]),
              "manifest_sha256": os.environ["EXPECTED_MANIFEST_SHA256"],
              "archive_base64_sha256": os.environ["EXPECTED_ARCHIVE_B64_SHA256"],
          }
          for key, value in expected.items():
              actual = data.get(key)
              if actual != value:
                  raise SystemExit(
                      f"metadata mismatch {key}: expected {value!r}, found {actual!r}"
                  )
          print("metadata verification: PASS")
          PY

      - name: Import every tracked source file
        shell: bash
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/mc-export"
          source_root="apps/mission-control"
          mkdir -p "$source_root"

          python - <<'PY'
          from pathlib import Path
          import os

          root = Path("apps/mission-control")
          manifest = Path(os.environ["RUNNER_TEMP"]) / "mc-export" / "SOURCE_MANIFEST.tsv"
          collisions = []
          for line in manifest.read_text(encoding="utf-8").splitlines():
              _, rel = line.split("\t", 1)
              target = root / rel
              if target.exists() or target.is_symlink():
                  collisions.append(rel)
          if collisions:
              raise SystemExit(
                  "source-path collision before import: " + ", ".join(collisions[:20])
              )
          print("source-path collision preflight: PASS")
          PY

          cat "$export_dir"/archive.b64.part.* | base64 -d > "$RUNNER_TEMP/mc-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/mc-source.tar.gz" -C "$source_root"
          cp "$export_dir/SOURCE_MANIFEST.tsv" "$source_root/SOURCE_MANIFEST.tsv"

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "source_repository": "novkien/agent-mission-control",
              "source_commit": os.environ["EXPECTED_SOURCE_COMMIT"],
              "source_tree": os.environ["EXPECTED_SOURCE_TREE"],
              "tracked_file_count": int(os.environ["EXPECTED_SOURCE_COUNT"]),
              "source_manifest": "SOURCE_MANIFEST.tsv",
              "source_manifest_sha256": os.environ["EXPECTED_MANIFEST_SHA256"],
              "archive_base64_sha256": os.environ["EXPECTED_ARCHIVE_B64_SHA256"],
              "canonical_target": "novkien/hermes-agent/apps/mission-control",
              "import_method": "byte-faithful git archive at the locked source commit",
              "imported_at_utc": datetime.now(timezone.utc).isoformat(),
              "original_tracked_files_preserved": True,
              "ongoing_source_repository_dependency": False,
          }
          Path("apps/mission-control/SOURCE_IMPORT.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify complete byte and mode parity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          import stat
          import subprocess

          root = Path("apps/mission-control")
          manifest = Path(os.environ["RUNNER_TEMP"]) / "mc-export" / "SOURCE_MANIFEST.tsv"
          missing = []
          mismatch = []
          mode_errors = []
          count = 0
          for line in manifest.read_text(encoding="utf-8").splitlines():
              count += 1
              meta, rel = line.split("\t", 1)
              mode, kind, expected_sha = meta.split()
              if kind != "blob":
                  raise SystemExit(f"unsupported source object {kind}: {rel}")
              target = root / rel
              if not target.exists() and not target.is_symlink():
                  missing.append(rel)
                  continue
              actual_sha = subprocess.check_output(
                  ["git", "hash-object", str(target)], text=True
              ).strip()
              if actual_sha != expected_sha:
                  mismatch.append((rel, expected_sha, actual_sha))
              if mode == "100755" and not (target.stat().st_mode & stat.S_IXUSR):
                  mode_errors.append(rel)
          print(
              f"source parity: tracked={count} missing={len(missing)} "
              f"blob_mismatch={len(mismatch)} mode_errors={len(mode_errors)}"
          )
          if count != int(os.environ["EXPECTED_SOURCE_COUNT"]):
              raise SystemExit(f"unexpected tracked count: {count}")
          if missing or mismatch or mode_errors:
              print("missing:", missing[:20])
              print("mismatch:", mismatch[:20])
              print("mode_errors:", mode_errors[:20])
              raise SystemExit(1)
          PY

          test -d apps/mission-control/agent_mission_control
          test -d apps/mission-control/frontend/dist
          test -d apps/mission-control/tests
          test -d apps/mission-control/tools
          test -d apps/mission-control/deploy
          test -f apps/mission-control/.hermes/proposed-plan/BRAINSTORM-AGENTOS-DASHBOARD-REFACTOR-R2.md
          test -f apps/mission-control/AGENTS.md
          test -f apps/mission-control/CLAUDE.md

          forbidden="$(find apps/mission-control -type f \
            \( -name '.env' -o -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' -o -name '*.log' \) \
            -print | grep -v '/hermes-mission-control.env.example$' || true)"
          if [ -n "$forbidden" ]; then
            printf 'Forbidden runtime files:\n%s\n' "$forbidden"
            exit 1
          fi
          test ! -d apps/mission-control/node_modules
          test ! -d apps/mission-control/.venv

      - name: Verify independent lifecycle integration
        shell: bash
        run: |
          set -euo pipefail
          test -f hermes_cli/mission_control.py
          test -f hermes_cli/subcommands/mission_control.py
          test -f apps/mission-control/HERMES_INTEGRATION.md
          test -f apps/mission-control/deploy/hermes-mission-control.service
          test -f apps/mission-control/deploy/hermes-mission-control.env.example
          test "$(grep -c '^Wants=hermes-mission-control.service$' hermes_cli/gateway.py)" = "2"
          ! grep -q '^Requires=hermes-mission-control.service$' hermes_cli/gateway.py
          ! grep -q '^PartOf=hermes-mission-control.service$' hermes_cli/gateway.py
          ! grep -q '^BindsTo=hermes-mission-control.service$' hermes_cli/gateway.py

      - name: Run Mission Control and integration tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q \
            "fastapi>=0.104,<1" "uvicorn>=0.24,<1" "httpx>=0.28,<1" \
            "cryptography>=42,<51" "pytest>=8,<10" "pytest-asyncio>=0.23,<2"
          python -m compileall -q \
            apps/mission-control/agent_mission_control \
            hermes_cli/mission_control.py \
            hermes_cli/subcommands/mission_control.py
          (cd apps/mission-control && PYTHONPATH=. python tests/test_runtime_contracts.py)
          (cd apps/mission-control && PYTHONPATH=. python tests/test_static_repair_surface.py)
          (cd apps/mission-control && node tests/frontend_contracts.mjs)
          (cd apps/mission-control && node tests/skills_surface.mjs)
          PYTHONPATH="$PWD" python -m pytest -q tests/hermes_cli/test_mission_control.py

      - name: Remove staging files, verify staged parity, and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-shot-import-mission-control.yml
          rm -f .github/scripts/integrate_mission_control_once.py
          git add -A

          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess

          manifest = Path(os.environ["RUNNER_TEMP"]) / "mc-export" / "SOURCE_MANIFEST.tsv"
          for line in manifest.read_text(encoding="utf-8").splitlines():
              meta, rel = line.split("\t", 1)
              expected_mode, kind, expected_sha = meta.split()
              if kind != "blob":
                  raise SystemExit(f"unsupported staged object {kind}: {rel}")
              output = subprocess.check_output(
                  ["git", "ls-files", "-s", "--", f"apps/mission-control/{rel}"],
                  text=True,
              ).strip()
              if not output:
                  raise SystemExit(f"missing staged source path: {rel}")
              index_meta = output.split("\t", 1)[0].split()
              mode, sha = index_meta[0], index_meta[1]
              if mode != expected_mode or sha != expected_sha:
                  raise SystemExit(
                      f"index parity mismatch {rel}: expected {expected_mode} {expected_sha}, "
                      f"found {mode} {sha}"
                  )
          print("staged source parity: PASS")
          PY

          git diff --cached --check
          git commit -m "feat: integrate complete AgentOS Mission Control source"
          git push origin "HEAD:$TARGET_BRANCH"
