name: One-shot full Mission Control import

on:
  push:
    branches:
      - agent/integrate-full-mission-control
    paths:
      - .github/workflows/one-shot-import-mission-control.yml

permissions:
  contents: write

concurrency:
  group: one-shot-import-mission-control
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: agent/integrate-full-mission-control
      ARTIFACT_URL: https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-aa7c-8211-a13a-ec2519ba72ef/raw?se=2026-08-14T11%3A08%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=b1b323e0-d0cb-51c0-85d6-f1fd675f1650&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-13T19%3A54%3A05Z&ske=2026-08-14T19%3A54%3A05Z&sks=b&skv=2026-02-06&sig=tkSaCWc1PFd6886bTwvnPgWg2I2d1%2BaWyYwXxnyPMmE%3D
      ARTIFACT_ZIP_SHA256: 8ed19668bc0eb897997cc0e041e5fa0bc9a81d26f10915e1e2b4a25de5714e0c
      EXPECTED_SOURCE_COMMIT: 42a9c191fdebc66ace4aac98a1e581d9ab7a13d1
      EXPECTED_SOURCE_TREE: 4fa5660d088401f2f62a4d76c37af60fadd747fc
      EXPECTED_SOURCE_COUNT: "147"
      EXPECTED_MANIFEST_SHA256: 3958406fa8d53029354be641a9f7e3938d5acf87e79048b4e0909f05129df5af
      EXPECTED_ARCHIVE_B64_SHA256: a9d514f35a840d2876f3edd573ccaeac3b1ff0c20c5ca30b8b698956f049c4f9

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          ref: agent/integrate-full-mission-control

      - name: Download and verify locked source artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/mc-export"
          mkdir -p "$RUNNER_TEMP/mc-export"
          curl --fail --location --retry 3 --silent --show-error \
            "$ARTIFACT_URL" -o "$RUNNER_TEMP/mc-source.zip"
          echo "$ARTIFACT_ZIP_SHA256  $RUNNER_TEMP/mc-source.zip" | sha256sum -c -
          python -m zipfile -e "$RUNNER_TEMP/mc-source.zip" "$RUNNER_TEMP/mc-export"

          actual_manifest_sha="$(sha256sum "$RUNNER_TEMP/mc-export/SOURCE_MANIFEST.tsv" | awk '{print $1}')"
          actual_source_count="$(wc -l < "$RUNNER_TEMP/mc-export/SOURCE_MANIFEST.tsv" | tr -d ' ')"
          actual_archive_b64_sha="$(cat "$RUNNER_TEMP/mc-export"/archive.b64.part.* | sha256sum | awk '{print $1}')"
          printf 'manifest_sha=%s\nsource_count=%s\narchive_b64_sha=%s\n' \
            "$actual_manifest_sha" "$actual_source_count" "$actual_archive_b64_sha"
          test "$actual_manifest_sha" = "$EXPECTED_MANIFEST_SHA256"
          test "$actual_source_count" = "$EXPECTED_SOURCE_COUNT"
          test "$actual_archive_b64_sha" = "$EXPECTED_ARCHIVE_B64_SHA256"

          python - "$RUNNER_TEMP/mc-export/EXPORT_METADATA.json" <<'PY'
          import json, os, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = {
              "source_commit": os.environ["EXPECTED_SOURCE_COMMIT"],
              "source_tree": os.environ["EXPECTED_SOURCE_TREE"],
              "tracked_file_count": int(os.environ["EXPECTED_SOURCE_COUNT"]),
              "manifest_sha256": os.environ["EXPECTED_MANIFEST_SHA256"],
              "archive_base64_sha256": os.environ["EXPECTED_ARCHIVE_B64_SHA256"],
          }
          for key, value in expected.items():
              actual = data.get(key)
              if actual != value:
                  raise SystemExit(f"metadata mismatch {key}: expected {value!r}, found {actual!r}")
          print("metadata verification: PASS")
          PY

      - name: Import all tracked source files and apply Hermes integration
        shell: bash
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/mc-export"/archive.b64.part.* | base64 -d > "$RUNNER_TEMP/mc-source.tar.gz"
          mkdir -p apps/mission-control
          tar -xzf "$RUNNER_TEMP/mc-source.tar.gz" -C apps/mission-control
          cp "$RUNNER_TEMP/mc-export/SOURCE_MANIFEST.tsv" apps/mission-control/SOURCE_MANIFEST.tsv

          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload = {
              "source_repository": "novkien/agent-mission-control",
              "source_commit": os.environ["EXPECTED_SOURCE_COMMIT"],
              "source_tree": os.environ["EXPECTED_SOURCE_TREE"],
              "tracked_file_count": int(os.environ["EXPECTED_SOURCE_COUNT"]),
              "source_manifest": "SOURCE_MANIFEST.tsv",
              "source_manifest_sha256": os.environ["EXPECTED_MANIFEST_SHA256"],
              "canonical_target": "novkien/hermes-agent/apps/mission-control",
              "imported_at_utc": datetime.now(timezone.utc).isoformat(),
              "original_tracked_files_preserved": True,
              "ongoing_source_repository_dependency": False,
          }
          Path("apps/mission-control/SOURCE_IMPORT.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

          echo "Applying deterministic Hermes integration edits..."
          python .github/scripts/integrate_mission_control_once.py
          echo "Hermes integration edits: PASS"

      - name: Verify complete source parity and forbidden-file boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          import stat
          import subprocess

          root = Path("apps/mission-control")
          manifest = Path(os.environ["RUNNER_TEMP"]) / "mc-export" / "SOURCE_MANIFEST.tsv"
          missing = []
          mismatch = []
          mode_errors = []
          count = 0
          for line in manifest.read_text(encoding="utf-8").splitlines():
              count += 1
              meta, rel = line.split("\t", 1)
              mode, kind, expected_sha = meta.split()
              target = root / rel
              if kind != "blob":
                  raise SystemExit(f"unsupported source object {kind}: {rel}")
              if not target.exists() and not target.is_symlink():
                  missing.append(rel)
                  continue
              actual_sha = subprocess.check_output(
                  ["git", "hash-object", str(target)], text=True
              ).strip()
              if actual_sha != expected_sha:
                  mismatch.append((rel, expected_sha, actual_sha))
              if mode == "100755" and not (target.stat().st_mode & stat.S_IXUSR):
                  mode_errors.append(rel)
          print(
              f"source parity: tracked={count} missing={len(missing)} "
              f"blob_mismatch={len(mismatch)} mode_errors={len(mode_errors)}"
          )
          if missing or mismatch or mode_errors:
              print("missing:", missing[:20])
              print("mismatch:", mismatch[:20])
              print("mode_errors:", mode_errors[:20])
              raise SystemExit(1)
          PY

          forbidden="$(find apps/mission-control -type f \
            \( -name '.env' -o -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' -o -name '*.log' \) \
            -print | grep -v '/hermes-mission-control.env.example$' || true)"
          if [ -n "$forbidden" ]; then
            printf 'Forbidden runtime files:\n%s\n' "$forbidden"
            exit 1
          fi
          test ! -d apps/mission-control/node_modules
          test ! -d apps/mission-control/.venv

      - name: Run Mission Control and integration tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q \
            "fastapi>=0.104,<1" "uvicorn>=0.24,<1" "httpx>=0.28,<1" \
            "cryptography>=42,<51" "pytest>=8,<10" "pytest-asyncio>=0.23,<2"
          python -m compileall -q \
            apps/mission-control/agent_mission_control \
            hermes_cli/mission_control.py \
            hermes_cli/subcommands/mission_control.py
          (cd apps/mission-control && PYTHONPATH=. python tests/test_runtime_contracts.py)
          (cd apps/mission-control && PYTHONPATH=. python tests/test_static_repair_surface.py)
          (cd apps/mission-control && node tests/frontend_contracts.mjs)
          (cd apps/mission-control && node tests/skills_surface.mjs)
          PYTHONPATH="$PWD" python -m pytest -q tests/hermes_cli/test_mission_control.py

      - name: Remove staging files, verify index parity, and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-shot-import-mission-control.yml
          rm -f .github/scripts/integrate_mission_control_once.py
          git add -A

          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          manifest = Path(os.environ["RUNNER_TEMP"]) / "mc-export" / "SOURCE_MANIFEST.tsv"
          for line in manifest.read_text(encoding="utf-8").splitlines():
              meta, rel = line.split("\t", 1)
              expected_mode, _, expected_sha = meta.split()
              output = subprocess.check_output(
                  ["git", "ls-files", "-s", "--", f"apps/mission-control/{rel}"],
                  text=True,
              ).strip()
              if not output:
                  raise SystemExit(f"missing staged source path: {rel}")
              index_meta = output.split("\t", 1)[0].split()
              mode, sha = index_meta[0], index_meta[1]
              if mode != expected_mode or sha != expected_sha:
                  raise SystemExit(
                      f"index parity mismatch {rel}: expected {expected_mode} {expected_sha}, "
                      f"found {mode} {sha}"
                  )
          print("staged source parity: PASS")
          PY

          git diff --cached --check
          git commit -m "feat: integrate complete AgentOS Mission Control source"
          git push origin "HEAD:$TARGET_BRANCH"
