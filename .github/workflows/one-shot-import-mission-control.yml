name: One-shot full Mission Control import

on:
  push:
    branches:
      - agent/integrate-full-mission-control
    paths:
      - .github/workflows/one-shot-import-mission-control.yml

permissions:
  contents: write

concurrency:
  group: one-shot-import-mission-control
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          ref: agent/integrate-full-mission-control

      - name: Import exact source artifact, validate, and push
        shell: bash
        env:
          TARGET_BRANCH: agent/integrate-full-mission-control
          ARTIFACT_URL: https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-f9bc-8206-a12b-815741c25d81/raw?se=2026-08-14T11%3A02%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=6b2ab254-627c-5589-9efe-7259f9944e73&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-14T00%3A25%3A35Z&ske=2026-08-15T00%3A25%3A35Z&sks=b&skv=2026-02-06&sig=FnBrHCMacc2VVmD%2BNPi5b5T8XGLNLwSolqGzbOSBhI8%3D
          ARTIFACT_ZIP_SHA256: 8ed19668bc0eb897997cc0e041e5fa0bc9a81d26f10915e1e2b4a25de5714e0c
          EXPECTED_SOURCE_COMMIT: 42a9c191fdebc66ace4aac98a1e581d9ab7a13d1
          EXPECTED_SOURCE_TREE: 4fa5660d088401f2f62a4d76c37af60fadd747fc
          EXPECTED_SOURCE_COUNT: "147"
          EXPECTED_MANIFEST_SHA256: 3958406fa8d53029354be641a9f7e3938d5acf87e79048b4e0909f05129df5af
          EXPECTED_ARCHIVE_B64_SHA256: a9d514f35a840d2876f3edd573ccaeac3b1ff0c20c5ca30b8b698956f049c4f9
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          payload_dir="$(mktemp -d)"
          trap 'rm -rf "$payload_dir"' EXIT
          curl --fail --location --retry 3 --silent --show-error "$ARTIFACT_URL" -o "$payload_dir/source-artifact.zip"
          echo "$ARTIFACT_ZIP_SHA256  $payload_dir/source-artifact.zip" | sha256sum -c -
          mkdir -p "$payload_dir/export"
          python -m zipfile -e "$payload_dir/source-artifact.zip" "$payload_dir/export"
          export_dir="$payload_dir/export"
          find "$export_dir" -maxdepth 1 -type f -printf '%f %s\n' | sort

          actual_manifest_sha="$(sha256sum "$export_dir/SOURCE_MANIFEST.tsv" | awk '{print $1}')"
          actual_source_count="$(wc -l < "$export_dir/SOURCE_MANIFEST.tsv" | tr -d ' ')"
          actual_archive_b64_sha="$(cat "$export_dir"/archive.b64.part.* | sha256sum | awk '{print $1}')"
          echo "manifest_sha=$actual_manifest_sha source_count=$actual_source_count archive_b64_sha=$actual_archive_b64_sha"
          test "$actual_manifest_sha" = "$EXPECTED_MANIFEST_SHA256"
          test "$actual_source_count" = "$EXPECTED_SOURCE_COUNT"
          test "$actual_archive_b64_sha" = "$EXPECTED_ARCHIVE_B64_SHA256"

          python - "$export_dir/EXPORT_METADATA.json" <<'PY_METADATA'
          import json, os, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data["source_commit"] == os.environ["EXPECTED_SOURCE_COMMIT"]
          assert data["source_tree"] == os.environ["EXPECTED_SOURCE_TREE"]
          assert data["tracked_file_count"] == int(os.environ["EXPECTED_SOURCE_COUNT"])
          assert data["manifest_sha256"] == os.environ["EXPECTED_MANIFEST_SHA256"]
          assert data["archive_base64_sha256"] == os.environ["EXPECTED_ARCHIVE_B64_SHA256"]
          PY_METADATA

          cat "$export_dir"/archive.b64.part.* | base64 -d > "$payload_dir/source.tar.gz"
          mkdir -p apps/mission-control
          tar -xzf "$payload_dir/source.tar.gz" -C apps/mission-control
          cp "$export_dir/SOURCE_MANIFEST.tsv" apps/mission-control/SOURCE_MANIFEST.tsv

          export SOURCE_COUNT="$EXPECTED_SOURCE_COUNT"
          python - <<'PY_SOURCE_IMPORT'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload = {
              "source_repository": "novkien/agent-mission-control",
              "source_commit": os.environ["EXPECTED_SOURCE_COMMIT"],
              "source_tree": os.environ["EXPECTED_SOURCE_TREE"],
              "tracked_file_count": int(os.environ["SOURCE_COUNT"]),
              "source_manifest": "SOURCE_MANIFEST.tsv",
              "source_manifest_sha256": os.environ["EXPECTED_MANIFEST_SHA256"],
              "canonical_target": "novkien/hermes-agent/apps/mission-control",
              "imported_at_utc": datetime.now(timezone.utc).isoformat(),
              "original_tracked_files_preserved": True,
              "ongoing_source_repository_dependency": False,
          }
          Path("apps/mission-control/SOURCE_IMPORT.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY_SOURCE_IMPORT

          python .github/scripts/integrate_mission_control_once.py

          while IFS=$'\t' read -r meta path; do
            mode="${meta%% *}"; rest="${meta#* }"; type="${rest%% *}"; sha="${rest##* }"
            target="apps/mission-control/$path"
            test "$type" = "blob"
            test -e "$target" || test -L "$target"
            test "$(git hash-object "$target")" = "$sha"
            if [ "$mode" = "100755" ]; then test -x "$target"; fi
          done < "$export_dir/SOURCE_MANIFEST.tsv"

          rm -f .github/workflows/one-shot-import-mission-control.yml
          rm -f .github/scripts/integrate_mission_control_once.py
          git add -A

          while IFS=$'\t' read -r meta path; do
            mode="${meta%% *}"; rest="${meta#* }"; sha="${rest##* }"
            entry="$(git ls-files -s -- "apps/mission-control/$path")"
            index_mode="${entry%% *}"; index_rest="${entry#* }"; index_sha="${index_rest%% *}"
            test "$index_mode" = "$mode"
            test "$index_sha" = "$sha"
          done < "$export_dir/SOURCE_MANIFEST.tsv"

          forbidden="$(git diff --cached --name-only | grep -E '(^|/)(\.env$|[^/]+\.db$|[^/]+\.db-wal$|[^/]+\.db-shm$|node_modules/|\.venv/|__pycache__/|[^/]+\.log$)' || true)"
          test -z "$forbidden"

          python -m pip install --disable-pip-version-check -q "fastapi>=0.104,<1" "uvicorn>=0.24,<1" "httpx>=0.28,<1" "cryptography>=42,<51" "pytest>=8,<10" "pytest-asyncio>=0.23,<2"
          python -m compileall -q apps/mission-control/agent_mission_control hermes_cli/mission_control.py hermes_cli/subcommands/mission_control.py
          (cd apps/mission-control && PYTHONPATH=. python tests/test_runtime_contracts.py)
          (cd apps/mission-control && PYTHONPATH=. python tests/test_static_repair_surface.py)
          (cd apps/mission-control && node tests/frontend_contracts.mjs)
          (cd apps/mission-control && node tests/skills_surface.mjs)
          PYTHONPATH="$PWD" python -m pytest -q tests/hermes_cli/test_mission_control.py
          git diff --cached --check

          git commit -m "feat: integrate complete AgentOS Mission Control source"
          git push origin "HEAD:$TARGET_BRANCH"
