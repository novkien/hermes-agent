name: Bootstrap static-prefix test fix

on:
  push:
    branches: [fix/runtime-invariant-regressions]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Replace brittle static-prefix assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/agent/test_system_prompt.py")
          text = path.read_text(encoding="utf-8")
          old = '    assert agent._cached_system_prompt_static == "\\n\\n".join(expected.split("\\n\\n")[:5])\n'
          new = '''    assert agent._cached_system_prompt_static == "\\n\\n".join((\n        ARTIFACT_FILESYSTEM_CONTRACT,\n        "IDENTITY",\n        "HELP",\n        "STEER",\n        "CODING_STABLE",\n    ))\n'''
          if text.count(old) != 1:
              raise SystemExit("unexpected static-prefix assertion count")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check

      - name: Commit test fix and remove bootstrap workflow
        run: |
          rm .github/workflows/bootstrap-static-prefix-test-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tests/agent/test_system_prompt.py .github/workflows/bootstrap-static-prefix-test-fix.yml
          git diff --cached --check
          git commit -m "test: assert static prompt blocks explicitly"
          git push origin HEAD:fix/runtime-invariant-regressions
