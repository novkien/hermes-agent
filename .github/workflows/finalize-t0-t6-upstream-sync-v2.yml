name: Finalize T0-T6 upstream sync PR v2

on:
  push:
    branches:
      - refactor/upstream-test-isolation-sync-20260826
    paths:
      - .github/workflows/finalize-t0-t6-upstream-sync-v2.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: t0-t6-final-publication
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FINAL_BRANCH: refactor/upstream-test-isolation-sync-20260826-t6
      STAGING_BRANCH: refactor/upstream-test-isolation-sync-20260826
      UPSTREAM_URL: https://github.com/NousResearch/hermes-agent.git
      HERMES_HOME: ${{ runner.temp }}/hermes-home
      HERMES_TEST_WORKERS: "8"
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENROUTER_API_KEY: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect an already-merged final PR
        id: precheck
        run: |
          merged_url="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${FINAL_BRANCH}" \
            --state merged \
            --json url \
            --jq '.[0].url // empty')"
          if test -n "$merged_url"; then
            echo "already_merged=true" >> "$GITHUB_OUTPUT"
            echo "pr_url=${merged_url}" >> "$GITHUB_OUTPUT"
            gh pr view "$merged_url" \
              --json number,url,state,mergedAt,mergeCommit,headRefOid \
              > "${RUNNER_TEMP}/final-pr-result.json"
          else
            echo "already_merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the validated candidate branch
        if: steps.precheck.outputs.already_merged != 'true'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            if git ls-remote --exit-code --heads origin "refs/heads/${FINAL_BRANCH}" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 20
          done
          echo "Validated candidate branch was not published" >&2
          exit 1

      - name: Check out candidate and live upstream
        if: steps.precheck.outputs.already_merged != 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/heads/${FINAL_BRANCH}:refs/remotes/origin/${FINAL_BRANCH}"
          git switch --detach "refs/remotes/origin/${FINAL_BRANCH}"
          git config user.name "LE TRUNG KIEN"
          git config user.email "mycompute1102@gmail.com"
          git config core.whitespace -trailing-space
          git remote remove hermes-upstream 2>/dev/null || true
          git remote add hermes-upstream "${UPSTREAM_URL}"
          git fetch --no-tags hermes-upstream main

      - name: Merge any final upstream movement
        if: steps.precheck.outputs.already_merged != 'true'
        id: catchup
        run: |
          set -euo pipefail
          locked="$(python -c "import json; print(json.load(open('fork/upstream-lock.json'))['sha'])")"
          live="$(git rev-parse refs/remotes/hermes-upstream/main)"
          echo "upstream_sha=${live}" >> "$GITHUB_OUTPUT"
          if test "$locked" = "$live"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge-tree --write-tree --name-only HEAD "$live" \
            > "${RUNNER_TEMP}/live-merge-simulation.txt"
          git merge --no-ff --no-commit "$live"
          test -z "$(git diff --name-only --diff-filter=U)"

          python - "$live" <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, 'scripts/fork_ci')
          from test_ownership import is_test_owned, read_tree

          upstream = sys.argv[1]
          paths = [p for p in read_tree(upstream) if is_test_owned(p)]
          spec = Path('/tmp/upstream-tests.nul')
          spec.write_bytes(b'\0'.join(p.encode() for p in paths) + b'\0')
          subprocess.run([
              'git', 'restore', f'--source={upstream}', '--staged', '--worktree',
              f'--pathspec-from-file={spec}', '--pathspec-file-nul'
          ], check=True)
          PY

          python scripts/fork_ci/update_upstream_lock.py --upstream-ref "$live"
          mkdir -p reports/upstream-sync/2026-08-26
          python - "$locked" "$live" > reports/upstream-sync/2026-08-26/live-catchup.json <<'PY'
          import json, sys
          print(json.dumps({
              'status': 'PASS',
              'previous_upstream_sha': sys.argv[1],
              'final_upstream_sha': sys.argv[2],
              'unresolved_conflicts': [],
              'test_path_conflicts': [],
          }, indent=2, sort_keys=True))
          PY
          git add -- \
            fork/upstream-lock.json \
            fork/manifests/upstream-tests.json \
            reports/upstream-sync/2026-08-26/live-catchup.json
          git diff --cached --check -- . \
            ':(exclude)evals/**' ':(exclude)fork_tests/snapshots/**'
          git commit -m "merge: catch up NousResearch/main before publication"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.precheck.outputs.already_merged != 'true'
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6
        if: steps.precheck.outputs.already_merged != 'true'

      - name: Install final locked environment
        if: steps.precheck.outputs.already_merged != 'true'
        run: uv sync --frozen --all-extras

      - name: Re-run final ownership and regression contracts
        if: steps.precheck.outputs.already_merged != 'true'
        run: |
          set -euo pipefail
          python scripts/fork_ci/verify_upstream_tests_untouched.py
          python scripts/fork_ci/inventory_tests.py
          python scripts/fork_ci/prepare_overlay.py \
            --destination "${RUNNER_TEMP}/fork-overlay"
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess

          repo = Path(os.environ['GITHUB_WORKSPACE'])
          overlay = Path(os.environ['RUNNER_TEMP']) / 'fork-overlay'
          nodeids = [line.strip() for line in (repo / 'fork_tests/nodeids-python.txt').read_text().splitlines() if line.strip()]
          report = repo / 'fork-regressions-final.xml'
          if nodeids:
              result = subprocess.run([
                  str(repo / '.venv/bin/python'), '-m', 'pytest', '-q', *nodeids,
                  f'--junitxml={report}',
              ], cwd=overlay)
              raise SystemExit(result.returncode)
          report.write_text("<testsuite tests='0' failures='0' errors='0' />\n")
          PY
          python apps/mission-control/tests/test_runtime_contracts.py
          python apps/mission-control/tests/test_static_repair_surface.py
          node apps/mission-control/tests/frontend_contracts.mjs
          node apps/mission-control/tests/skills_surface.mjs
          python -m compileall -q agent gateway hermes_cli tools \
            apps/mission-control/agent_mission_control

      - name: Publish final catch-up non-force
        if: steps.precheck.outputs.already_merged != 'true' && steps.catchup.outputs.changed == 'true'
        run: git push origin "HEAD:refs/heads/${FINAL_BRANCH}"

      - name: Assert graph and clean source state
        if: steps.precheck.outputs.already_merged != 'true'
        id: graph
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          upstream_sha="$(python -c "import json; print(json.load(open('fork/upstream-lock.json'))['sha'])")"
          git merge-base --is-ancestor "$upstream_sha" HEAD
          test "$(git show -s --format=%P HEAD | wc -w)" -ge 2
          test -z "$(git status --porcelain --untracked-files=all \
            | grep -v '^?? fork-regressions-final.xml$' || true)"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"

      - name: Create or reuse final non-draft PR
        if: steps.precheck.outputs.already_merged != 'true'
        id: pr
        env:
          UPSTREAM_SHA: ${{ steps.graph.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          pr_url="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${FINAL_BRANCH}" \
            --base master \
            --state open \
            --json url \
            --jq '.[0].url // empty')"
          if test -z "$pr_url"; then
            upstream_count="$(python -c "import json; print(json.load(open('reports/upstream-sync/2026-08-26/t6-merge-validation.json'))['upstream_commit_count'])")"
            snapshot_count="$(python -c "import json; print(len(json.load(open('fork_tests/manifest.json'))['entries']))")"
            node_count="$(grep -cve '^$' fork_tests/nodeids-python.txt || true)"
            cat > "${RUNNER_TEMP}/pr-body.md" <<EOF
          ## Summary
          - isolate owner regression tests from every upstream-owned test path
          - enforce byte-identical upstream tests with a locked manifest and independent workflow
          - add deterministic fork test overlays, contract mapping, and failure classification
          - merge NousResearch/hermes-agent main through ${UPSTREAM_SHA}

          ## Validation
          - upstream commits from merge base: ${upstream_count}
          - fork regression snapshots: ${snapshot_count}
          - extracted Python regression node IDs: ${node_count}
          - upstream test-path conflicts: 0
          - upstream test integrity: PASS
          - fork Python regressions: PASS
          - Mission Control contracts: PASS
          - Python compilation: PASS

          Upstream history is preserved through ordinary multi-parent merge commits. No force push or history rewrite was used.
          EOF
            pr_url="$(gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base master \
              --head "${FINAL_BRANCH}" \
              --title "test(fork): isolate regressions and sync NousResearch/main" \
              --body-file "${RUNNER_TEMP}/pr-body.md")"
          fi
          echo "url=${pr_url}" >> "$GITHUB_OUTPUT"
          gh pr view "$pr_url" --json number,url,headRefOid,mergeable,mergeStateStatus

      - name: Merge the exact validated PR head
        if: steps.precheck.outputs.already_merged != 'true'
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          EXPECTED_HEAD: ${{ steps.graph.outputs.head_sha }}
        run: |
          set -euo pipefail
          state="$(gh pr view "$PR_URL" --json state --jq '.state')"
          if test "$state" = MERGED; then
            gh pr view "$PR_URL" --json number,url,state,mergedAt,mergeCommit,headRefOid \
              > "${RUNNER_TEMP}/final-pr-result.json"
            exit 0
          fi
          for _ in $(seq 1 60); do
            mergeable="$(gh pr view "$PR_URL" --json mergeable --jq '.mergeable')"
            test "$mergeable" != CONFLICTING || exit 1
            test "$mergeable" != UNKNOWN && break
            sleep 5
          done
          actual="$(gh pr view "$PR_URL" --json headRefOid --jq '.headRefOid')"
          test "$actual" = "$EXPECTED_HEAD"
          if ! gh pr merge "$PR_URL" --merge --match-head-commit "$EXPECTED_HEAD"; then
            state="$(gh pr view "$PR_URL" --json state --jq '.state')"
            test "$state" = MERGED
          fi
          gh pr view "$PR_URL" --json number,url,state,mergedAt,mergeCommit,headRefOid \
            > "${RUNNER_TEMP}/final-pr-result.json"

      - name: Close any staging-only PR
        if: always()
        run: |
          gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${STAGING_BRANCH}" \
            --state open \
            --json number \
            --jq '.[].number' \
          | while read -r number; do
              test -n "$number" || continue
              gh pr close "$number" \
                --comment "Closed: staging transport only; the validated candidate uses the dedicated final PR."
            done

      - name: Upload final publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0-t6-final-publication-evidence-v2
          path: |
            ${{ runner.temp }}/final-pr-result.json
            reports/upstream-sync/2026-08-26/t0-t4-inventory.json
            reports/upstream-sync/2026-08-26/t6-merge-validation.json
            reports/upstream-sync/2026-08-26/live-catchup.json
            fork-regressions-final.xml
          if-no-files-found: warn
          retention-days: 14
