name: AgentOS Repository Sync PR

on:
  pull_request:
    paths:
      - 'apps/mission-control/**'
      - '.github/workflows/agentos-repository-sync-pr.yml'

permissions:
  contents: read

jobs:
  repository-sync-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: >-
          python3 -m compileall -q
          apps/mission-control/agent_mission_control/repository_sync.py
          apps/mission-control/agent_mission_control/repository_runner.py
          apps/mission-control/agent_mission_control/repository_routes.py
          apps/mission-control/tools/repo_sync.py
          apps/mission-control/tests/test_repository_sync.py
      - name: Repository sync integration tests
        working-directory: apps/mission-control
        run: python3 tests/test_repository_sync.py
      - name: Repository UI syntax
        run: node --check apps/mission-control/frontend/dist/tabs/repositories.js
      - name: Repository UI contracts
        working-directory: apps/mission-control
        run: node tests/repository_surface.mjs
