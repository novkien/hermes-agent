name: Normalize repository live topology
on:
  push:
    branches: [owner/repository-control-plane]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Apply owner topology correction
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/patch_pr14.py
          python /tmp/patch_pr14.py
      - name: Validate focused repository control
        shell: bash
        run: |
          python apps/mission-control/tests/test_repository_sync.py
          node apps/mission-control/tests/repository_surface.mjs
          python -m py_compile apps/mission-control/agent_mission_control/repository_sync.py apps/mission-control/agent_mission_control/repository_runner.py apps/mission-control/agent_mission_control/repository_routes.py apps/mission-control/tools/repo_sync.py
          node --check apps/mission-control/frontend/dist/tabs/repositories.js
          git diff --check
      - name: Commit correction and remove bootstrap workflow
        shell: bash
        run: |
          rm .github/workflows/normalize-repository-live-topology.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add -- apps/mission-control/config/repositories.yaml
          git diff --cached --check
          git commit -m 'fix(repository): use canonical live source paths'
          git push origin HEAD:owner/repository-control-plane
