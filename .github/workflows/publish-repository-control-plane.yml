name: Publish repository control plane payload

on:
  push:
    branches: [owner/repository-control-plane]

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Materialize exact complete-file payload
        run: |
          cat .github/repository-control-payload/*.part | base64 --decode > /tmp/repository-control-plane.tar.xz
          echo "f9169614b8e09cf12e7c5a064be502f28077dd0649242535162613fefecc193a  /tmp/repository-control-plane.tar.xz" | sha256sum -c -
          tar -xJf /tmp/repository-control-plane.tar.xz
          rm -rf .github/repository-control-payload
          rm .github/workflows/publish-repository-control-plane.yml
          python -m compileall -q \
            apps/mission-control/agent_mission_control/repository_routes.py \
            apps/mission-control/agent_mission_control/repository_runner.py \
            apps/mission-control/agent_mission_control/repository_sync.py \
            apps/mission-control/tools/repo_sync.py
          node --check apps/mission-control/frontend/dist/tabs/repositories.js
          node --check apps/mission-control/tests/repository_surface.mjs
          git diff --check

      - name: Commit exact payload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/repository-control-payload \
            .github/workflows/publish-repository-control-plane.yml \
            apps/mission-control/agent_mission_control/repository_routes.py \
            apps/mission-control/agent_mission_control/repository_runner.py \
            apps/mission-control/agent_mission_control/repository_sync.py \
            apps/mission-control/config/repositories.yaml \
            apps/mission-control/frontend/dist/repositories.css \
            apps/mission-control/frontend/dist/tabs/repositories.js \
            apps/mission-control/tests/repository_surface.mjs \
            apps/mission-control/tests/test_repository_sync.py \
            apps/mission-control/tools/repo_sync.py
          python - <<'PY'
          import subprocess
          expected = sorted([
              '.github/repository-control-payload/00.part',
              '.github/repository-control-payload/01.part',
              '.github/repository-control-payload/02.part',
              '.github/repository-control-payload/03.part',
              '.github/workflows/publish-repository-control-plane.yml',
              'apps/mission-control/agent_mission_control/repository_routes.py',
              'apps/mission-control/agent_mission_control/repository_runner.py',
              'apps/mission-control/agent_mission_control/repository_sync.py',
              'apps/mission-control/config/repositories.yaml',
              'apps/mission-control/frontend/dist/repositories.css',
              'apps/mission-control/frontend/dist/tabs/repositories.js',
              'apps/mission-control/tests/repository_surface.mjs',
              'apps/mission-control/tests/test_repository_sync.py',
              'apps/mission-control/tools/repo_sync.py',
          ])
          actual = sorted(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected staged paths: {actual}')
          PY
          git diff --cached --check
          git commit -m "feat(repository): add owner control plane"
          git push origin HEAD:owner/repository-control-plane
