name: Finalize T0-T6 upstream sync PR

on:
  push:
    branches:
      - refactor/upstream-test-isolation-sync-20260826
    paths:
      - .github/workflows/finalize-t0-t6-upstream-sync.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-create-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FINAL_BRANCH: refactor/upstream-test-isolation-sync-20260826-t6
      STAGING_BRANCH: refactor/upstream-test-isolation-sync-20260826
      UPSTREAM_URL: https://github.com/NousResearch/hermes-agent.git
      HERMES_HOME: ${{ runner.temp }}/hermes-home
      HERMES_TEST_WORKERS: "8"
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENROUTER_API_KEY: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout staging transport
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for validated candidate publication
        run: |
          set -euo pipefail
          found=0
          for _ in $(seq 1 180); do
            if git ls-remote --exit-code --heads origin "refs/heads/${FINAL_BRANCH}" >/dev/null 2>&1; then
              found=1
              break
            fi
            sleep 20
          done
          test "$found" = 1

      - name: Check out exact candidate and fetch live upstream
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/heads/${FINAL_BRANCH}:refs/remotes/origin/${FINAL_BRANCH}"
          git switch --detach "refs/remotes/origin/${FINAL_BRANCH}"
          git config user.name "LE TRUNG KIEN"
          git config user.email "mycompute1102@gmail.com"
          git config core.whitespace -trailing-space
          git remote remove hermes-upstream 2>/dev/null || true
          git remote add hermes-upstream "${UPSTREAM_URL}"
          git fetch --no-tags hermes-upstream main

      - name: Catch up again when upstream moved during validation
        id: catchup
        run: |
          set -euo pipefail
          locked="$(python - <<'PY'
          import json
          print(json.load(open('fork/upstream-lock.json'))['sha'])
          PY
          )"
          live="$(git rev-parse refs/remotes/hermes-upstream/main)"
          echo "locked_sha=${locked}" >> "$GITHUB_OUTPUT"
          echo "live_sha=${live}" >> "$GITHUB_OUTPUT"
          if test "$locked" = "$live"; then
            echo "catchup=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          simulation="$(mktemp)"
          if ! git merge-tree --write-tree --name-only HEAD "$live" >"$simulation"; then
            cat "$simulation"
            echo "Live upstream catch-up has conflicts" >&2
            exit 1
          fi

          git merge --no-ff --no-commit "$live"
          test -z "$(git diff --name-only --diff-filter=U)"

          python - "$live" <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, 'scripts/fork_ci')
          from test_ownership import is_test_owned, read_tree

          upstream = sys.argv[1]
          paths = [p for p in read_tree(upstream) if is_test_owned(p)]
          pathspec = Path('/tmp/upstream-test-paths.nul')
          pathspec.write_bytes(b'\0'.join(p.encode() for p in paths) + b'\0')
          subprocess.run([
              'git', 'restore', f'--source={upstream}', '--staged', '--worktree',
              f'--pathspec-from-file={pathspec}', '--pathspec-file-nul'
          ], check=True)
          PY

          python scripts/fork_ci/update_upstream_lock.py \
            --upstream-ref "$live"
          mkdir -p reports/upstream-sync/2026-08-26
          python - "$locked" "$live" > reports/upstream-sync/2026-08-26/live-catchup.json <<'PY'
          import json, sys
          print(json.dumps({
              'status': 'PASS',
              'previous_upstream_sha': sys.argv[1],
              'final_upstream_sha': sys.argv[2],
              'test_path_conflicts': [],
          }, indent=2, sort_keys=True))
          PY
          git add -- \
            fork/upstream-lock.json \
            fork/manifests/upstream-tests.json \
            reports/upstream-sync/2026-08-26/live-catchup.json
          git diff --cached --check -- . \
            ':(exclude)evals/**' ':(exclude)fork_tests/snapshots/**'
          git commit -m "merge: catch up NousResearch/main before publication"
          echo "catchup=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Install final merged environment
        run: uv sync --frozen --all-extras

      - name: Re-run immutable ownership and fork regressions
        run: |
          set -euo pipefail
          python scripts/fork_ci/verify_upstream_tests_untouched.py
          python scripts/fork_ci/inventory_tests.py
          python scripts/fork_ci/prepare_overlay.py \
            --destination "${RUNNER_TEMP}/fork-overlay"
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess

          repo = Path(os.environ['GITHUB_WORKSPACE'])
          overlay = Path(os.environ['RUNNER_TEMP']) / 'fork-overlay'
          nodeids = [
              line.strip()
              for line in (repo / 'fork_tests/nodeids-python.txt').read_text().splitlines()
              if line.strip()
          ]
          report = repo / 'fork-regressions-final.xml'
          if nodeids:
              command = [
                  str(repo / '.venv/bin/python'), '-m', 'pytest', '-q', *nodeids,
                  f'--junitxml={report}',
              ]
              raise SystemExit(subprocess.run(command, cwd=overlay).returncode)
          report.write_text("<testsuite tests='0' failures='0' errors='0' />\n")
          PY
          python apps/mission-control/tests/test_runtime_contracts.py
          python apps/mission-control/tests/test_static_repair_surface.py
          node apps/mission-control/tests/frontend_contracts.mjs
          node apps/mission-control/tests/skills_surface.mjs
          python -m compileall -q agent gateway hermes_cli tools \
            apps/mission-control/agent_mission_control

      - name: Publish optional live catch-up non-force
        if: steps.catchup.outputs.catchup == 'true'
        run: |
          git push origin "HEAD:refs/heads/${FINAL_BRANCH}"

      - name: Assert final graph and clean source state
        id: graph
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          upstream_sha="$(python - <<'PY'
          import json
          print(json.load(open('fork/upstream-lock.json'))['sha'])
          PY
          )"
          git merge-base --is-ancestor "$upstream_sha" HEAD
          test "$(git show -s --format=%P HEAD | wc -w)" -ge 2
          test -z "$(git status --porcelain --untracked-files=all \
            | grep -v '^?? fork-regressions-final.xml$' || true)"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"

      - name: Create the final non-draft PR
        id: pr
        run: |
          set -euo pipefail
          pr_url="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${FINAL_BRANCH}" \
            --base master \
            --state open \
            --json url \
            --jq '.[0].url // empty')"
          if test -z "$pr_url"; then
            upstream_count="$(python - <<'PY'
          import json
          print(json.load(open('reports/upstream-sync/2026-08-26/t6-merge-validation.json'))['upstream_commit_count'])
          PY
            )"
            snapshot_count="$(python - <<'PY'
          import json
          print(json.load(open('fork_tests/manifest.json'))['entries'].__len__())
          PY
            )"
            node_count="$(wc -l < fork_tests/nodeids-python.txt | tr -d ' ')"
            cat > "${RUNNER_TEMP}/pr-body.md" <<EOF
          ## Summary
          - isolate every owner-modified or owner-only regression test from the upstream test namespace
          - lock upstream-owned tests byte-for-byte and enforce the boundary in an independent workflow
          - add deterministic fork regression overlays, contract metadata, failure classification, and T6 merge simulation evidence
          - merge NousResearch/hermes-agent main through ${UPSTREAM_SHA}

          ## Evidence
          - upstream commits since merge base: ${upstream_count}
          - fork regression snapshots: ${snapshot_count}
          - extracted Python regression node IDs: ${node_count}
          - upstream test-path merge conflicts: 0
          - immutable upstream test guard: PASS
          - fork Python regressions: PASS
          - Mission Control contracts: PASS
          - Python compilation: PASS

          The branch keeps the upstream merge as an ordinary multi-parent commit; no history rewrite or force push was used.
          EOF
            pr_url="$(gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base master \
              --head "${FINAL_BRANCH}" \
              --title "test(fork): isolate regressions and sync NousResearch/main" \
              --body-file "${RUNNER_TEMP}/pr-body.md")"
          fi
          echo "url=${pr_url}" >> "$GITHUB_OUTPUT"
          gh pr view "$pr_url" --json number,url,headRefOid,mergeable,mergeStateStatus

      - name: Wait for GitHub mergeability and merge exact head
        id: merge
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          EXPECTED_HEAD: ${{ steps.graph.outputs.head_sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            mergeable="$(gh pr view "$PR_URL" --json mergeable --jq '.mergeable')"
            state="$(gh pr view "$PR_URL" --json mergeStateStatus --jq '.mergeStateStatus')"
            if test "$mergeable" = CONFLICTING; then
              echo "PR became conflicting" >&2
              exit 1
            fi
            if test "$mergeable" = MERGEABLE && test "$state" != UNKNOWN; then
              break
            fi
            sleep 5
          done
          actual_head="$(gh pr view "$PR_URL" --json headRefOid --jq '.headRefOid')"
          test "$actual_head" = "$EXPECTED_HEAD"
          gh pr merge "$PR_URL" \
            --merge \
            --match-head-commit "$EXPECTED_HEAD"
          gh pr view "$PR_URL" \
            --json number,url,state,mergedAt,mergeCommit,headRefOid \
            > "${RUNNER_TEMP}/final-pr-result.json"
          cat "${RUNNER_TEMP}/final-pr-result.json"

      - name: Close staging-only PR if one was opened
        if: always()
        run: |
          gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${STAGING_BRANCH}" \
            --state open \
            --json number \
            --jq '.[].number' \
          | while read -r number; do
              test -n "$number" || continue
              gh pr close "$number" \
                --comment "Closed: staging transport only. The validated candidate was published and merged through the dedicated final PR."
            done

      - name: Upload final publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0-t6-final-publication-evidence
          path: |
            ${{ runner.temp }}/final-pr-result.json
            reports/upstream-sync/2026-08-26/t0-t4-inventory.json
            reports/upstream-sync/2026-08-26/t6-merge-validation.json
            reports/upstream-sync/2026-08-26/live-catchup.json
            fork-regressions-final.xml
          if-no-files-found: warn
          retention-days: 14
