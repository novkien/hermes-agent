name: PR mergeability

on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-mergeability-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mergeability:
    if: github.event_name == 'pull_request_target'
    name: PR merges with master
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Verify clean merge
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"
          actual_head="$(git rev-parse refs/remotes/origin/pr-head)"

          if [ "$actual_head" != "$EXPECTED_HEAD" ]; then
            echo "::notice::PR head moved; the newer synchronize run will validate it."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git merge --no-commit --no-ff "$actual_head"; then
            git merge --abort || true
            echo "PR cleanly merges with current master."
          else
            git status --short
            git merge --abort || true
            echo "::error::PR conflicts with current master."
            exit 1
          fi
