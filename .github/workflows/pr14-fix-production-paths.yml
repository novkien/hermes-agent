name: Apply PR14 production paths
on:
  push:
    branches: [owner/repository-control-plane]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: owner/repository-control-plane
          fetch-depth: 0
      - name: Apply production path correction
        run: python .github/pr14_fix_production_paths.py
      - name: Validate focused repository control
        run: |
          python -m unittest apps.mission-control.tests.test_repository_sync
          node apps/mission-control/tests/repository_surface.mjs
          python -m compileall -q apps/mission-control/agent_mission_control apps/mission-control/tools
          node --check apps/mission-control/frontend/dist/tabs/repositories.js
          ! grep -R "worktrees/{repository}/production\|production_worktree" apps/mission-control/config apps/mission-control/agent_mission_control/repository_sync.py apps/mission-control/tests
      - name: Commit clean result
        run: |
          rm -f \
            .github/pr14_fix_production_paths.py \
            .github/pr14_topology_a.py \
            .github/pr14_topology_b.py \
            .github/pr14_topology_c.py \
            .github/workflows/pr14-apply-live-topology.yml \
            .github/workflows/pr14-fix-production-paths.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(repository): use canonical live production paths"
          git push origin HEAD:owner/repository-control-plane
