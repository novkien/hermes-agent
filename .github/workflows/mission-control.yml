name: Mission Control

on:
  pull_request:
    paths:
      - "apps/mission-control/**"
      - ".github/workflows/mission-control.yml"
  push:
    branches: [master]
    paths:
      - "apps/mission-control/**"
      - ".github/workflows/mission-control.yml"

permissions:
  contents: read

concurrency:
  group: mission-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: Python and Node contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Set up Node.js 26
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26

      - name: Install dependencies
        run: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Install frontend contract dependencies
        run: npm ci --ignore-scripts

      - name: Run all Mission Control Python tests
        working-directory: apps/mission-control
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          set -euo pipefail
          for test_file in tests/test_*.py; do
            echo "Running $test_file"
            uv run --project "$GITHUB_WORKSPACE" --no-sync python "$test_file"
          done

      - name: Run all Mission Control Node tests
        working-directory: apps/mission-control
        run: |
          set -euo pipefail
          for test_file in tests/*.mjs; do
            echo "Running $test_file"
            node "$test_file"
          done

      - name: Compile backend
        working-directory: apps/mission-control
        run: uv run --project "$GITHUB_WORKSPACE" --no-sync python -m compileall -q agent_mission_control

      - name: Check backend lint and formatting
        working-directory: apps/mission-control
        run: |
          uv run --project "$GITHUB_WORKSPACE" --no-sync ruff check agent_mission_control tests
          uv run --project "$GITHUB_WORKSPACE" --no-sync ruff format --check agent_mission_control tests
