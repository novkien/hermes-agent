name: Verify T0-T6 merged state

on:
  push:
    branches:
      - refactor/upstream-test-isolation-sync-20260826
    paths:
      - .github/workflows/verify-t0-t6-merged-state.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: t0-t6-post-merge-verifier
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FINAL_BRANCH: refactor/upstream-test-isolation-sync-20260826-t6
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate final PR and ensure it is merged
        id: pr
        run: |
          set -euo pipefail
          pr_url=""
          for _ in $(seq 1 180); do
            pr_url="$(gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --head "${FINAL_BRANCH}" \
              --state all \
              --json url \
              --jq '.[0].url // empty')"
            test -n "$pr_url" && break
            sleep 10
          done
          test -n "$pr_url"
          state="$(gh pr view "$pr_url" --json state --jq '.state')"
          if test "$state" != MERGED; then
            head_sha="$(gh pr view "$pr_url" --json headRefOid --jq '.headRefOid')"
            if ! gh pr merge "$pr_url" --merge --match-head-commit "$head_sha"; then
              state="$(gh pr view "$pr_url" --json state --jq '.state')"
              test "$state" = MERGED
            fi
          fi
          gh pr view "$pr_url" \
            --json number,url,state,mergedAt,mergeCommit,headRefOid \
            > "${RUNNER_TEMP}/merged-pr.json"
          test "$(jq -r '.state' "${RUNNER_TEMP}/merged-pr.json")" = MERGED
          echo "url=${pr_url}" >> "$GITHUB_OUTPUT"

      - name: Verify master graph and immutable tests
        id: master
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          git switch --detach refs/remotes/origin/master
          test -f fork/upstream-lock.json
          test -f fork/manifests/upstream-tests.json
          test -f fork_tests/manifest.json
          test -f .github/workflows/fork-regressions.yml
          upstream_sha="$(python -c "import json; print(json.load(open('fork/upstream-lock.json'))['sha'])")"
          git merge-base --is-ancestor "$upstream_sha" HEAD
          python scripts/fork_ci/verify_upstream_tests_untouched.py \
            > "${RUNNER_TEMP}/upstream-test-integrity.json"
          master_sha="$(git rev-parse HEAD)"
          echo "master_sha=${master_sha}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"

      - name: Post exact merge evidence to final PR
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          MASTER_SHA: ${{ steps.master.outputs.master_sha }}
          UPSTREAM_SHA: ${{ steps.master.outputs.upstream_sha }}
        run: |
          snapshots="$(python -c "import json; print(len(json.load(open('fork_tests/manifest.json'))['entries']))")"
          nodeids="$(grep -cve '^$' fork_tests/nodeids-python.txt || true)"
          cat > "${RUNNER_TEMP}/verification-comment.md" <<EOF
          T0-T6 post-merge verification: **PASS**

          - merged master SHA: \`${MASTER_SHA}\`
          - locked NousResearch/main SHA: \`${UPSTREAM_SHA}\`
          - upstream SHA is an ancestor of master: PASS
          - upstream-owned tests are byte-identical to lock: PASS
          - fork regression snapshots: ${snapshots}
          - extracted Python fork regression node IDs: ${nodeids}
          - independent fork workflow present: PASS
          EOF
          gh pr comment "$PR_URL" --body-file "${RUNNER_TEMP}/verification-comment.md"

      - name: Upload merged-state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0-t6-merged-state-evidence
          path: |
            ${{ runner.temp }}/merged-pr.json
            ${{ runner.temp }}/upstream-test-integrity.json
          if-no-files-found: error
          retention-days: 14
