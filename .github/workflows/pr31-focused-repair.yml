name: PR 31 focused repair

on:
  push:
    branches:
      - automation/pr31-fix-run-20260825
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_SHA: e4b160dd9eda66e4f1904c549e25ebb2d9d5b429
      PR_BASE_SHA: 6873a2d8e03f2d7180bc405934f31d5ca09f599b
      RESULT_BRANCH: automation/pr31-fixed-result-v3-20260825

    steps:
      - name: Check out the exact reviewed PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: e4b160dd9eda66e4f1904c549e25ebb2d9d5b429
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git diff --quiet
          git diff --cached --quiet

      - name: Apply the focused repair
        shell: bash
        env:
          PATCH_GZIP_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          payload = gzip.decompress(base64.b64decode(os.environ["PATCH_GZIP_B64"]))
          Path("/tmp/pr31_patch.py").write_bytes(payload)
          PY
          python3 /tmp/pr31_patch.py
          git diff --check
          git status --short

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Install Python 3.11
        shell: bash
        run: uv python install 3.11

      - name: Install locked test dependencies
        shell: bash
        run: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Run focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q tests/agent/test_project_skills.py tests/agent/test_session_event_relay.py tests/gateway/test_session_env.py

      - name: Run focused lint
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check agent/prompt_builder.py agent/session_event_relay.py gateway/session_context.py tests/agent/test_project_skills.py tests/agent/test_session_event_relay.py tests/gateway/test_session_env.py

      - name: Audit imported contributor attribution
        shell: bash
        run: |
          set -euo pipefail
          git update-ref refs/remotes/origin/main "$PR_BASE_SHA"
          python3 scripts/audit_pr_attribution.py

      - name: Commit the verified repair on a clean result branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Primary ChatGPT via GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$RESULT_BRANCH"
          git add agent/prompt_builder.py agent/session_event_relay.py gateway/session_context.py tests/agent/test_project_skills.py tests/agent/test_session_event_relay.py tests/gateway/test_session_env.py contributors/emails
          git diff --cached --check
          git commit -m "fix: close upstream integration review gaps"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git push origin "HEAD:refs/heads/$RESULT_BRANCH"

          {
            echo "### PR #31 focused repair"
            echo
            echo "- Parent: \`$BASE_SHA\`"
            echo "- Result: \`$(git rev-parse HEAD)\`"
            echo "- Branch: \`$RESULT_BRANCH\`"
            echo "- Focused tests, ruff, and attribution audit passed before commit."
          } >> "$GITHUB_STEP_SUMMARY"
