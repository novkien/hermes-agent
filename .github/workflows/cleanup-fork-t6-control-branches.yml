name: Cleanup fork T6 control branches

on:
  push:
    branches:
      - automation/fork-test-t6-control-final-10
    paths:
      - .github/workflows/cleanup-fork-t6-control-branches.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: novkien/hermes-agent
      CONTROL_BRANCH: automation/fork-test-t6-control-final-10
    steps:
      - name: Delete task branches only after a validated final PR merge
        run: |
          set -euo pipefail

          final_branches=(
            refactor/upstream-test-isolation-sync-20260826-t6
            refactor/fork-tests-t6-upstream-sync-20260826-final
          )

          merged_final=""
          for final_branch in "${final_branches[@]}"; do
            merged_url="$(gh pr list \
              --repo "$REPO" \
              --state merged \
              --head "$final_branch" \
              --json url \
              --jq '.[0].url // empty')"
            if test -n "$merged_url"; then
              merged_final="$merged_url"
              break
            fi
          done

          if test -z "$merged_final"; then
            echo "No validated final PR is merged; preserving every task and control branch."
            exit 0
          fi

          branches=(
            refactor/upstream-test-isolation-sync-20260826
            refactor/upstream-test-isolation-sync-20260826-t6
            refactor/fork-tests-t6-upstream-sync-20260826
            refactor/fork-tests-t6-upstream-sync-20260826-final
            automation/fork-test-t6-builder-20260826
            automation/fork-test-t6-builder-control-20260826
            automation/fork-test-t6-builder-control-20260826-v2
            automation/fork-test-t6-builder-control-20260826-v3
            automation/fork-test-t6-builder-control-20260826-v4
            automation/fork-test-t6-control-final
            automation/fork-test-t6-control-final-2
            automation/fork-test-t6-control-final-3
            automation/fork-test-t6-control-final-4
            automation/fork-test-t6-control-final-5
            automation/fork-test-t6-control-final-6
            automation/fork-test-t6-control-final-7
            automation/fork-test-t6-control-final-8
            automation/fork-test-t6-control-final-9
            "$CONTROL_BRANCH"
          )

          echo "Validated final PR merged: $merged_final"
          for branch in "${branches[@]}"; do
            encoded="$(jq -rn --arg value "heads/$branch" '$value|@uri')"
            gh api -X DELETE "/repos/$REPO/git/refs/$encoded" >/dev/null 2>&1 || true
          done
