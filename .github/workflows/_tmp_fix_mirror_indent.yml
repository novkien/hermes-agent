name: Temporary mirror formatting cleanup

on:
  push:
    branches:
      - fix/kanban-chat-live-mirror

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kanban-chat-live-mirror

      - name: Normalize mirror block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          chat = Path("apps/mission-control/frontend/dist/tabs/chat.js")
          source = chat.read_text()
          marker = '  function startMirror(sessionId, sessionProfile, list) {'
          start = source.index(marker)
          end = source.find('\n  function ', start + len(marker))
          assert end > start
          block = source[start:end]
          assert 'mirrorTimer = setInterval' in block
          new_block = (
              "  function startMirror(sessionId, sessionProfile, list) {\n"
              "    stopMirror();\n"
              "\n"
              "    const scheduleMirror = () => {\n"
              "      if (mirrorTimer) clearInterval(mirrorTimer);\n"
              "      const intervalMs = document.hidden\n"
              "        ? MIRROR_HIDDEN_INTERVAL_MS\n"
              "        : MIRROR_INTERVAL_MS;\n"
              "      mirrorTimer = setInterval(() => {\n"
              "        mirrorThread(sessionId, sessionProfile, list).catch(() => null);\n"
              "      }, intervalMs);\n"
              "    };\n"
              "\n"
              "    mirrorVisibility = () => {\n"
              "      scheduleMirror();\n"
              "      if (!document.hidden) {\n"
              "        mirrorThread(sessionId, sessionProfile, list).catch(() => null);\n"
              "      }\n"
              "    };\n"
              "    document.addEventListener('visibilitychange', mirrorVisibility);\n"
              "    scheduleMirror();\n"
              "  }"
          )
          chat.write_text(source[:start] + new_block + source[end:])
          Path('.github/workflows/_tmp_fix_mirror_indent.yml').unlink()
          PY

      - name: Validate
        shell: bash
        run: |
          python -m py_compile gateway/platforms/api_server.py
          node --check apps/mission-control/frontend/dist/tabs/chat.js
          git diff --check
          if git diff --name-only | grep -qx 'hermes_cli/kanban_db.py'; then
            echo 'Native Kanban implementation was modified unexpectedly' >&2
            exit 1
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(mission-control): normalize mirror fallback block"
          git push origin HEAD:fix/kanban-chat-live-mirror
