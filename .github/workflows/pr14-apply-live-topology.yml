name: Apply PR14 live topology
on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: write
concurrency:
  group: pr14-live-topology
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: owner/repository-control-plane
          fetch-depth: 0
      - name: Apply topology changes
        run: |
          python .github/pr14_topology_a.py
          python .github/pr14_topology_b.py
          python .github/pr14_topology_c.py
      - name: Validate
        run: |
          python apps/mission-control/tests/test_repository_sync.py
          node apps/mission-control/tests/repository_surface.mjs
          python -m py_compile apps/mission-control/agent_mission_control/repository_sync.py apps/mission-control/agent_mission_control/repository_runner.py apps/mission-control/agent_mission_control/repository_routes.py apps/mission-control/tools/repo_sync.py
          node --check apps/mission-control/frontend/dist/tabs/repositories.js
          ! grep -R -n -E 'production_worktree:|worktrees/\{repository\}/production|~/.hermes/worktrees/' apps/mission-control/config/repositories.yaml apps/mission-control/agent_mission_control/repository_sync.py apps/mission-control/tests/test_repository_sync.py apps/mission-control/tests/repository_surface.mjs
          git diff --check
      - name: Commit clean result
        run: |
          rm .github/pr14_topology_a.py .github/pr14_topology_b.py .github/pr14_topology_c.py .github/workflows/pr14-apply-live-topology.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --check
          git commit -m 'fix(repository): bind Git metadata to canonical live paths'
          git push origin HEAD:owner/repository-control-plane
