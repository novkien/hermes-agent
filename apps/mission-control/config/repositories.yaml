version: 1

# GitHub origins default to HTTPS. SSH here selects the managed host where Git
# runs; it does not require that host to have a separate GitHub SSH key.

layout:
  git_dir: repos/{repository}.git

hosts:
  jarvis:
    transport: local
    hermes_home: ~/.hermes
  jarvis-pi:
    transport: ssh
    ssh_target: jarvis-pi
    hermes_home: ~/.hermes
  workstation:
    transport: ssh
    ssh_target: workstation
    hermes_home: ~/.hermes

repositories:
  hermes:
    github: novkien/hermes
    branch: master
    host: jarvis
    git_dir: .git
    work_tree: .
    local_mode: superproject
    sync_script: scripts/sync.sh
    visibility: private

  hermes-agent:
    github: novkien/hermes-agent
    branch: master
    host: jarvis
    work_tree: hermes-agent
    local_mode: remote_only
    visibility: public
    upstream: NousResearch/hermes-agent

  hermes-skills:
    github: novkien/hermes-skills
    branch: master
    host: jarvis
    work_tree: .
    local_mode: remote_only
    paths:
      - skills
      - workspace/skills-pack
    visibility: private

  hermes-plugins:
    github: novkien/hermes-plugins
    branch: master
    host: jarvis
    work_tree: plugins
    local_mode: remote_only
    visibility: private

  agents:
    github: novkien/agents
    branch: master
    host: jarvis
    work_tree: profiles
    local_mode: remote_only
    visibility: private

  llama-proxy:
    github: novkien/llama-proxy
    branch: master
    host: jarvis-pi
    work_tree: /home/pi/llama-proxy
    local_mode: remote_only
    visibility: private

  9router:
    github: novkien/9router
    branch: master
    host: jarvis-pi
    work_tree: /home/pi/9router
    local_mode: remote_only
    visibility: public
    upstream: decolua/9router

  godot-mcp:
    github: novkien/godot-mcp
    branch: main
    host: workstation
    work_tree: /home/novkien/godot-mcp
    local_mode: remote_only
    visibility: public
    upstream: tugcantopaloglu/godot-mcp
